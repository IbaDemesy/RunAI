<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo agent view</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme-dawn.css">
</head>
<body class="live-page">
  <div class="browser">
    <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><code id="url">about:blank</code></div>
    <div class="browser-body">
      <p class="muted">Demo agent view · <span id="label"></span> · <span id="status" role="status" aria-live="polite"></span></p>
      <h2 id="action">Waiting for the agent…</h2>
      <ol id="history"></ol>
    </div>
  </div>
  <script>
    const STATUS = { pending: "waiting", running: "in progress", paused: "paused", stopped_before_commitment: "stopped before commitment", completed: "prepared", failed: "could not finish" };
    const session = new URLSearchParams(location.search).get("session");
    async function refresh() {
      const response = await fetch(`/api/live/${encodeURIComponent(session)}`);
      if (!response.ok) return;
      const live = await response.json();
      document.getElementById("label").textContent = live.label;
      document.getElementById("status").textContent = STATUS[live.step.status] || live.step.status;
      document.getElementById("url").textContent = live.step.data.current_url || "about:blank";
      document.getElementById("action").textContent = live.step.data.last_action || "Waiting for the agent…";
      const list = document.getElementById("history");
      list.replaceChildren(...live.history.map((event) => {
        const item = document.createElement("li");
        item.textContent = event.message;
        return item;
      }));
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
